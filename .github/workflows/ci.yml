name: Windows CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Check source formatting and translations
        run: ./scripts/check.ps1
      - name: Start Windows audio services
        run: |
          foreach ($name in 'AudioEndpointBuilder','Audiosrv') {
            if ((Get-Service $name).Status -ne 'Running') { Start-Service $name }
          }
      - name: Build, test, and package
        run: ./scripts/build.ps1 -Generator 'Visual Studio 18 2026' -Package
      - uses: actions/upload-artifact@v7
        with:
          name: WaveTandem-win-x64
          path: out/dist/*
          if-no-files-found: error
